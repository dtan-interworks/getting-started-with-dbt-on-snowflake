env_config:
  default_environment: dev
  environments: 
    - name: dev 
      env:
        DBT_SNOWFLAKE_ROLE: accountadmin
        DBT_SNOWFLAKE_DATABASE: tasty_bytes_dbt_db
        DBT_SNOWFLAKE_SCHEMA: "{{ SELECT 'DBT_' || REPLACE(SPLIT_PART(CURRENT_USER(), '@', 1), '.', '_') }}"
        DBT_SNOWFLAKE_WAREHOUSE: tasty_bytes_dbt_wh
    - name: prod 
      env:
        DBT_SNOWFLAKE_ROLE: accountadmin
        DBT_SNOWFLAKE_DATABASE: tasty_bytes_dbt_db
        DBT_SNOWFLAKE_SCHEMA: prod
        DBT_SNOWFLAKE_WAREHOUSE: tasty_bytes_dbt_wh